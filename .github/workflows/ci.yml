name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || pip install -e . pytest pytest-asyncio pytest-cov
      - name: Run tests with coverage gate
        # Coverage source + fail_under live in pyproject.toml ([tool.coverage.*]).
        # TODO: raise fail_under gradually as coverage improves (currently ~73.7%).
        run: pytest --cov --cov-report=term-missing
